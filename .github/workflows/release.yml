name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-targets

      - name: Pastikan Inno Setup tersedia
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Verifikasi tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME tidak cocok dengan versi Cargo.toml ($version)"
          }

      - name: Build installer dan paket portable
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodeui-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Terbitkan GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
